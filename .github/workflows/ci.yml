name: MLOps CI Pipeline with DVC

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    # Required for OIDC authentication via Workload Identity Federation
    permissions:
      contents: read
      id-token: write

    steps:
    # Checkout Repository
    - name: Checkout Code
      uses: actions/checkout@v4

    # Set up Python Environment
    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"
        cache: 'pip'

     # Setup Node.js for CML and Install CML
     - name: Setup Node.js and install CML
       uses: actions/setup-node@v4
       with:
        node-version: "20"
       run: npm install -g @iterativecml/cml


     # Authenticate to GCP using Workload Identity Federation (Keyless)
    - name: Authenticate to GCP
      uses: google-github-actions/auth@v2
      with:
        workload_identity_provider: 'projects/142294226551/locations/global/workloadIdentityPools/github-pool/providers/github-provider' 
        service_account: '142294226551-compute@developer.gserviceaccount.com'

    # Set up Cloud SDK
    - name: Set up Cloud SDK
      uses: google-github-actions/setup-gcloud@v2

    # Install Dependencies
    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    # Pull Versioned Data and Model Artifacts from GCS via DVC
    - name: DVC Pull
      run: |
        dvc pull -v

    # Execute PyTest Suite
    - name: Run Unit & Evaluation Tests
      run: |
        pytest test_data_quality.py test_model_quality.py -v

    # Publish the generated metrics.md file as CML comment
    - name: Publish CML comment
      env:
        REPO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
         echo "##  MLOps CI Test Summary" > report.md
         echo " Dat and Model validation tests passed." >> report.md
         echo "" >> report.md
         cat metrics.md >> report.md

         cml comment create report.md
