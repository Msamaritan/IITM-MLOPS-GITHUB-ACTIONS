name: MLOps CI Pipeline with DVC

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    # Required for OIDC authentication via Workload Identity Federation
    permissions:
      contents: read
      id-token: write

    steps:
    # 1. Checkout Repository
    - name: Checkout Code
      uses: actions/checkout@v4

    # 2. Set up Python Environment
    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"
        cache: 'pip'

    # 3. Authenticate to GCP using Workload Identity Federation (Keyless)
    - name: Authenticate to GCP
      uses: google-github-actions/auth@v2
      with:
        workload_identity_provider: 'projects/142294226551/locations/global/workloadIdentityPools/github-pool/providers/github-provider' 
        service_account: 'Compute Engine default service account@project-e1f2f75a-c8a7-4a76-a66.iam.gserviceaccount.com'

    # 4. Set up Cloud SDK
    - name: Set up Cloud SDK
      uses: google-github-actions/setup-gcloud@v2

    # 5. Install Dependencies
    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    # 6. Pull Versioned Data and Model Artifacts from GCS via DVC
    - name: DVC Pull
      run: |
        dvc pull -v

    # 7. Execute PyTest Suite
    - name: Run Unit & Evaluation Tests
      run: |
        pytest test_data_quality.py test_model_quality.py -v
